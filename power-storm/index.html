<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#7fb6c9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>סערת כוחות</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&family=Secular+One&display=swap" rel="stylesheet">
<style>
/* Phone-first (held sideways) superhero UI: cream comic paper + chunky discs over a sunny 2.5D town.
   Thumbs own the bottom corners, status owns the top. Element colours are warm and natural, never neon. */
:root{
  --paper:#fbf0dc; --paper2:#f0dfbf; --paper3:#e4cfa6; --ink:#2b1d14; --ink2:#6b4a30;
  --red:#c8372b; --red2:#8d1f17; --redhi:#ef6a4f; --teal:#1f6a6a; --teal2:#124646;
  --gold:#e6a93a; --gold2:#a4691a; --heart:#d8433b;
  --fire1:#ffc06a; --fire2:#e0652a; --fire3:#9a2d10;
  --ice1:#e4f3fa; --ice2:#8dbfd8; --ice3:#3f7a99;
  --bolt1:#fff1b0; --bolt2:#e7b93a; --bolt3:#94650f;
  --wind1:#f4f8f2; --wind2:#a9c9c2; --wind3:#4d7c74;
  --shade:rgba(36,24,14,.84);
  --display:'Secular One','Rubik',system-ui,sans-serif; --ui:'Rubik',system-ui,sans-serif;
  --lift:0 3px 0 rgba(43,29,20,.32), 0 8px 18px rgba(30,20,10,.22);
  --sb: env(safe-area-inset-bottom, 0px); --st: env(safe-area-inset-top, 0px);
  --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
  color-scheme: light;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{direction:rtl}
html,body{margin:0; height:100%; overflow:hidden; background:#7fb6c9; color:var(--ink); font-family:var(--ui);
  touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; overscroll-behavior:none}
canvas#c{position:fixed; inset:0; width:100%; height:100%; display:block}
button{font-family:inherit; cursor:pointer; color:inherit}
button:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.hidden{display:none !important}

/* ================= top HUD ================= */
#hud{position:fixed; inset:0; pointer-events:none; z-index:5}
#top{position:absolute; top:calc(7px + var(--st)); left:max(8px, var(--sl)); right:max(8px, var(--sr)); display:flex; gap:8px; align-items:flex-start}
#card{position:relative; display:flex; align-items:center; gap:8px; background:linear-gradient(#fffaf0,#f3e4c6); border-radius:16px;
  box-shadow:0 0 0 3px #fff4dc, 0 0 0 5.5px rgba(43,29,20,.6), 0 6px 14px rgba(30,20,10,.28); padding:5px 12px 6px 10px; margin:4px 24px 0 0}
#stack{display:flex; flex-direction:column; gap:3px}
#hearts{display:flex; gap:2px}
#hearts svg{width:23px; height:23px; filter:drop-shadow(0 1.5px 0 rgba(43,29,20,.3))}
#hearts.hit svg{animation:shake .35s}
#meters{display:flex; flex-direction:column; gap:3px; width:clamp(118px,19vw,170px)}
.mrow{display:flex; align-items:center; gap:5px}
.ml{font:800 10px/1 var(--ui); color:var(--ink2); min-width:34px}
.meter{position:relative; flex:1; height:9px; border-radius:6px; background:#dcc8a0; overflow:hidden; box-shadow:inset 0 1px 2px rgba(43,29,20,.35), 0 0 0 1.5px rgba(43,29,20,.35)}
.meter i{position:absolute; inset:0 auto 0 0; width:100%; border-radius:6px; transform-origin:left; transition:transform .12s linear}
#energy i{background:linear-gradient(#7fc6d8,#2f8aa6)}
#energy.low i{background:linear-gradient(#f0a08a,#c8372b)}
#storm i{background:linear-gradient(90deg,#e0652a,#e7b93a,#8dbfd8)}
#storm.full{animation:pulse 1s ease-in-out infinite}
#energy i{box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
#coins{position:absolute; right:-24px; top:50%; width:50px; height:50px; margin-top:-25px; display:grid; place-items:center}
#coins svg{position:absolute; inset:0; width:100%; height:100%; filter:drop-shadow(0 2px 0 rgba(43,29,20,.55)) drop-shadow(0 4px 6px rgba(0,0,0,.25))}
#coins span{position:relative; font:900 15px/1 var(--ui); color:#3a2208; font-variant-numeric:tabular-nums}
#card{padding-right:34px}
#coins.bump{animation:pop .3s}
#lvlChip{align-self:center; color:#fff8e6; padding:6px 4px; font:400 17px/1 var(--display); white-space:nowrap; letter-spacing:.01em;
  -webkit-text-stroke:3px rgba(43,29,20,.7); paint-order:stroke fill; text-shadow:0 2px 0 rgba(43,29,20,.6), 0 4px 10px rgba(0,0,0,.3)}
#bossBar{position:absolute; top:calc(70px + var(--st)); left:50%; transform:translateX(-50%); width:min(56vw,460px); text-align:center}
#bossBar span{display:inline-block; font:400 16px/1 var(--display); color:#fff3dc; text-shadow:0 2px 0 rgba(43,29,20,.7); margin-bottom:4px}
#bossBar .meter{height:13px; box-shadow:0 0 0 3px rgba(43,29,20,.55), inset 0 1px 2px rgba(43,29,20,.3)}
#bossBar .meter i{background:linear-gradient(#e6a93a,#a4691a)}
.iconBtn{pointer-events:auto; width:44px; height:44px; flex:none; border-radius:50%; border:3px solid #fff4dc; color:#fff4dc; margin-inline-start:auto;
  background:radial-gradient(circle at 50% 28%, #3c6f72, #173b3d 72%); display:grid; place-items:center;
  box-shadow:0 0 0 3px rgba(30,20,12,.5), 0 4px 0 3px rgba(30,20,12,.4), 0 8px 14px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.2)}
.iconBtn svg{width:18px; height:18px}
.iconBtn:active{transform:translateY(3px) scale(.94); filter:brightness(1.15)}
#hint{position:absolute; top:calc(var(--st) + 78px); right:max(8px, var(--sr)); max-width:min(44vw,400px);
  display:flex; align-items:center; gap:8px; background:var(--shade); color:#fff6e2; border-radius:14px; padding:7px 12px; font:500 13.5px/1.35 var(--ui);
  box-shadow:0 6px 16px rgba(0,0,0,.2); transition:opacity .3s, transform .3s}
#hint.off{opacity:0; transform:translateY(-6px)}
body.boss #hint{top:calc(var(--st) + 112px)}
body.boss #banner{top:36%}
#hint b{color:#ffd77a; font-weight:800}
#hint svg{width:22px; height:22px; flex:none}
#pops{position:absolute; left:0; right:0; top:34%; display:flex; flex-direction:column; align-items:center; gap:4px}
.pop{background:rgba(251,240,220,.96); border-radius:14px; padding:4px 12px; font:800 15px/1.2 var(--ui); box-shadow:0 3px 0 rgba(43,29,20,.25);
  animation:popin .22s ease-out, popout .45s ease-in 1.2s forwards}
.pop.warn{background:#f8d9cf; color:#8f1f19}
@keyframes popin{from{transform:translateY(10px) scale(.8); opacity:0}}
@keyframes popout{to{transform:translateY(-26px); opacity:0}}
#banner{position:absolute; top:20%; left:0; right:0; text-align:center; pointer-events:none; padding:0 16px}
#banner div{display:inline-block; font:400 clamp(30px,8vh,52px)/1.05 var(--display); color:#fff8e6; -webkit-text-stroke:2px rgba(43,29,20,.6); paint-order:stroke fill;
  text-shadow:0 4px 0 rgba(43,29,20,.6), 0 12px 30px rgba(0,0,0,.25); animation:ban 2.6s forwards}
#banner small{display:block; margin-top:6px; font:800 clamp(14px,3.6vh,19px)/1.2 var(--ui); -webkit-text-stroke:0; text-shadow:0 2px 3px rgba(0,0,0,.6)}
@keyframes ban{0%{transform:scale(.6); opacity:0}12%{transform:scale(1.06); opacity:1}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0; transform:translateY(-14px)}}
@keyframes pop{50%{transform:scale(1.25)}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(231,185,58,.75), inset 0 1px 2px rgba(43,29,20,.25)}}
#flash{position:fixed; inset:0; z-index:4; pointer-events:none; background:#fff6e0; opacity:0}

/* ================= thumb controls ================= */
/* one family: chunky discs with a cream inner rim + dark outer rim, readable on sky, stone and water;
   each power wears its element colour; press = shrink + brighten; cooldown = cream ring; locked powers are hidden */
#controls{position:fixed; inset:0; pointer-events:none; z-index:6}
#stickZone{position:absolute; left:0; bottom:0; width:46%; height:72%; pointer-events:auto}
#stick{position:absolute; left:calc(24px + var(--sl) + 60px); bottom:calc(24px + var(--sb) + 60px); width:120px; height:120px; margin:0 0 -60px -60px;
  border-radius:50%; background:radial-gradient(circle at 50% 40%, rgba(255,250,238,.42), rgba(240,226,196,.30) 62%, rgba(214,191,147,.36));
  box-shadow:0 0 0 3px rgba(255,244,220,.95), 0 0 0 5.5px rgba(30,20,12,.42), inset 0 -6px 14px rgba(120,90,50,.25), 0 8px 18px rgba(0,0,0,.18);
  backdrop-filter:blur(1.5px);
  opacity:.9; transition:opacity .2s, transform .15s}
#stick.on{opacity:1; transform:scale(1.04)}
#stick .ch{position:absolute; width:0; height:0; border:8px solid transparent; opacity:.9}
#stick .ch.l{left:8px; top:50%; margin-top:-8px; border-right-color:#fff4dc; border-left:0}
#stick .ch.r{right:8px; top:50%; margin-top:-8px; border-left-color:#fff4dc; border-right:0}
#knob{position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px 0 0 -29px; border-radius:50%;
  background:radial-gradient(circle at 42% 34%, #fffdf6, #f1e3c3 60%, #d6bf93);
  box-shadow:0 0 0 3px rgba(30,20,12,.5), 0 4px 0 2px rgba(30,20,12,.4), 0 10px 18px rgba(0,0,0,.3)}
#knob:after{content:''; position:absolute; inset:15px; border-radius:50%; box-shadow:inset 0 2px 5px rgba(43,29,20,.4); background:rgba(214,191,147,.35)}
#stick .tag{bottom:-13px}
#btns{position:absolute; right:max(14px, var(--sr)); bottom:calc(16px + var(--sb)); width:300px; height:250px; pointer-events:none; transform-origin:bottom right}
.cbtn{position:absolute; border:4px solid #fff4dc; border-radius:50%; pointer-events:auto; display:grid; place-items:center; padding:0; color:#fff8e6;
  background:radial-gradient(circle at 50% 28%, #6b4a30, #3a2615 72%);
  box-shadow:0 0 0 3px rgba(30,20,12,.6), 0 5px 0 3px rgba(30,20,12,.5), 0 12px 20px rgba(0,0,0,.32), inset 0 4px 0 rgba(255,255,255,.28), inset 0 -7px 12px rgba(0,0,0,.28);
  transition:transform .07s, filter .07s, box-shadow .07s, opacity .2s; touch-action:none}
.cbtn.down{transform:translateY(4px) scale(.93); filter:brightness(1.18);
  box-shadow:0 0 0 3px rgba(30,20,12,.55), 0 2px 0 3px rgba(30,20,12,.5), 0 6px 12px rgba(0,0,0,.3), inset 0 3px 0 rgba(255,255,255,.22), inset 0 -6px 10px rgba(0,0,0,.25)}
.cbtn > svg.ico{width:54%; height:54%; filter:drop-shadow(0 2px 0 rgba(0,0,0,.35)); pointer-events:none}
.cbtn.cool{filter:saturate(.35) brightness(.85)}
.cbtn.cool.down{filter:saturate(.5) brightness(1)}
.cbtn.noen{filter:saturate(.2) brightness(.75)}
.tag{position:absolute; left:50%; bottom:-12px; transform:translateX(-50%); background:#fff4dc; color:#2b1d14; font:800 12px/1 var(--ui);
  padding:4px 9px 3px; border-radius:10px; white-space:nowrap; pointer-events:none;
  box-shadow:0 0 0 2px rgba(30,20,12,.55), 0 3px 0 2px rgba(30,20,12,.35)}
.ring{position:absolute; inset:-9px; width:calc(100% + 18px); height:calc(100% + 18px); pointer-events:none; transform:rotate(-90deg)}
.ring circle{fill:none; stroke:#fff4dc; stroke-width:5; stroke-linecap:round; stroke-dasharray:100; stroke-dashoffset:100; filter:drop-shadow(0 0 2px rgba(30,20,12,.7))}
#bPunch{right:122px; bottom:0; width:80px; height:80px; background:radial-gradient(circle at 50% 26%, #ef6a4f, #c8372b 58%, #7d1a12)}
#bPunch.charging{animation:charge .25s ease-in-out infinite alternate}
@keyframes charge{to{filter:brightness(1.3) saturate(1.2); transform:translateY(4px) scale(.96)}}
#bJump{right:0; bottom:10px; width:108px; height:108px; border-width:6px; background:radial-gradient(circle at 50% 26%, #5b9aa0, #1f6a6a 60%, #0f3c3d)}
#bJump .tag{font-size:14px; padding:5px 12px 4px; bottom:-13px}
#bJump.fly{background:radial-gradient(circle at 50% 26%, #c6ddd6, #6f9e94 60%, #35615a)}
#bFire{right:22px; bottom:140px; width:62px; height:62px; background:radial-gradient(circle at 50% 26%, var(--fire1), var(--fire2) 58%, var(--fire3))}
#bIce{right:98px; bottom:118px; width:62px; height:62px; background:radial-gradient(circle at 50% 26%, var(--ice1), var(--ice2) 58%, var(--ice3))}
#bBolt{right:176px; bottom:100px; width:62px; height:62px; background:radial-gradient(circle at 50% 26%, var(--bolt1), var(--bolt2) 58%, var(--bolt3))}
#bIce .tag,#bFire .tag,#bBolt .tag{font-size:11.5px}
#bStorm{right:214px; bottom:170px; width:74px; height:74px; border-color:#fff8e6;
  background:conic-gradient(from 0deg, #e0652a, #e7b93a, #8dbfd8, #6f9e94, #e0652a); animation:stormSpin 3s linear infinite}
#bStorm > svg.ico{animation:stormSpin 3s linear infinite reverse}
@keyframes stormSpin{to{transform:rotate(360deg)}}
#bStorm.down{animation-play-state:paused}

/* ================= panels ================= */
.overlay{position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; background:rgba(22,16,10,.45);
  padding:8px max(8px, var(--sr)) 8px max(8px, var(--sl))}
.panel{background:linear-gradient(#fdf4e1,#f3e2c1); width:100%; max-width:660px; max-height:calc(100vh - 22px - var(--st) - var(--sb)); display:flex; flex-direction:column; overflow:hidden;
  border-radius:22px; box-shadow:inset 0 0 0 3px #fff8ea, 0 0 0 5px #7a5230, 0 0 0 7.5px #3a2412, 0 14px 40px rgba(0,0,0,.38); animation:pin .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pin{from{transform:translateY(24px) scale(.94); opacity:0}}
.phead{position:relative; display:flex; align-items:center; justify-content:center; gap:10px; padding:11px 56px 6px}
.phead h2{margin:0; font:400 26px/1.15 var(--display); text-align:center; text-wrap:balance; color:var(--ink)}
.close{position:absolute; left:12px; top:9px; width:40px; height:40px; flex:none; border-radius:50%; border:3px solid #fff8ea; background:radial-gradient(circle at 50% 30%, #fffaf0, #ecdcbb);
  color:var(--ink); font:900 20px/1 var(--ui); box-shadow:0 0 0 2.5px #3a2412, 0 3px 0 2px rgba(43,29,20,.45)}
.close:active{transform:translateY(2px)}
.pbody{padding:4px 16px 14px; display:flex; flex-direction:column; gap:9px; overflow-y:auto; touch-action:pan-y}
.lead{font:500 15px/1.5 var(--ui); margin:0; text-wrap:pretty}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:4px 2px; font:800 15px var(--ui)}
.row input[type=range]{flex:1; max-width:250px; accent-color:var(--red); height:28px}
.toggle{width:52px; height:30px; flex:none; border-radius:16px; border:none; background:var(--paper3); position:relative}
.toggle:after{content:''; position:absolute; top:3px; right:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:right .2s}
.toggle.on{background:var(--red)} .toggle.on:after{right:25px}
.btnrow{display:flex; gap:10px; flex-wrap:wrap}
.btnrow > *{flex:1}
.big{border:4px solid #fff4dc; border-radius:15px; padding:13px 16px; font:400 23px/1 var(--display); color:#fff8e6; min-height:54px;
  background:radial-gradient(120% 140% at 50% 0%, #ef6a4f, #c8372b 60%, #7d1a12);
  box-shadow:0 0 0 3px rgba(30,20,12,.55), 0 6px 0 3px rgba(30,20,12,.5), 0 14px 26px rgba(0,0,0,.3), inset 0 3px 0 rgba(255,255,255,.25); text-shadow:0 2px 0 rgba(0,0,0,.3)}
.big.sec{background:linear-gradient(#fffaf0,#f0dfbf); color:var(--ink); border-color:#fffaf0; font:800 16px/1 var(--ui); text-shadow:none;
  box-shadow:0 0 0 3px rgba(30,20,12,.45), 0 6px 0 3px rgba(30,20,12,.35), 0 12px 22px rgba(0,0,0,.2)}
.big.teal{background:radial-gradient(120% 140% at 50% 0%, #5b9aa0, #1f6a6a 60%, #0f3c3d)}
.big:active{transform:translateY(4px) scale(.98); filter:brightness(1.08)}
.big:disabled{filter:grayscale(.8) brightness(.9)}
/* level map */
.levels{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px}
.lv{position:relative; border:none; border-radius:14px; padding:10px 6px 10px; background:linear-gradient(#fffcf4,#f7ead0);
  box-shadow:inset 0 0 0 2px #fffdf8, 0 0 0 2px #b8946a, 0 4px 0 1px rgba(90,60,30,.28);
  display:flex; flex-direction:column; align-items:center; justify-content:space-between; gap:6px; text-align:center; min-height:138px}
.lv .n{width:52px; height:52px; border-radius:50%; display:grid; place-items:center; font:400 27px/1 var(--display); color:var(--ink);
  background:radial-gradient(circle at 50% 32%, #fffdf6, #f1e3c3 70%, #e0cba0); box-shadow:inset 0 0 0 3px #fff8ea, 0 0 0 3px #3a2412, 0 3px 0 2px rgba(43,29,20,.35)}
.lv b{font:800 13.5px/1.15 var(--ui); color:var(--ink)}
.lv .st{display:flex; align-items:center; gap:2px; min-height:22px} .lv .st svg{width:17px; height:17px} .lv .st .pw{width:20px; height:20px; margin-inline-start:2px}
.lv .st .lk{width:24px; height:24px}
.lv .pwb{width:23px; height:23px; margin-inline-start:3px; border-radius:50%; display:grid; place-items:center; box-shadow:0 0 0 2px #fff8ea, 0 0 0 3.5px #3a2412}
.lv .pwb svg{width:15px; height:15px}
.lv .crown{position:absolute; top:6px; left:6px; width:24px; height:24px; border-radius:50%; background:radial-gradient(circle at 50% 30%, #ffd77a, #d49a26 70%, #8a5a12);
  box-shadow:0 0 0 2px #3a2412; display:grid; place-items:center; font:400 14px/1 var(--display); color:#3a2208}
.lv.lock{filter:grayscale(.65); opacity:.78} .lv.lock .n{color:#6b5a48}
.lv:active:not(.lock){transform:translateY(3px)}
.lv.next{box-shadow:inset 0 0 0 2px #fffdf8, 0 0 0 3.5px var(--red), 0 4px 0 1px rgba(90,60,30,.28)}
.lv.next .n{box-shadow:inset 0 0 0 3px #fff8ea, 0 0 0 3px #8d1f17, 0 3px 0 2px rgba(43,29,20,.35)}
/* power card */
.powerCard{display:flex; gap:14px; align-items:center}
.powerCard .orb{width:96px; height:96px; flex:none; border-radius:50%; display:grid; place-items:center; border:4px solid #fff4dc;
  box-shadow:0 0 0 4px rgba(30,20,12,.5), 0 8px 0 3px rgba(30,20,12,.35); animation:orb 2.4s ease-in-out infinite}
.powerCard .orb svg{width:56%; height:56%; filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
@keyframes orb{50%{transform:translateY(-5px) rotate(-4deg)}}
.how{display:block; background:#fffaf0; border-radius:14px; padding:8px 12px; font:500 14px/1.4 var(--ui); text-wrap:pretty}
.how b{font-weight:800; color:var(--red2)}
.how kbd{font:800 12px var(--ui); background:var(--paper2); border-radius:6px; padding:1px 6px}
/* results */
.stars{display:flex; justify-content:center; gap:10px; margin:2px 0}
.stars svg{width:56px; height:56px; transform:scale(0); transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
.stars svg.on{transform:scale(1)}
.stat{display:flex; justify-content:space-between; gap:12px; background:#fffaf0; border-radius:14px; padding:8px 14px; font:800 15px var(--ui)}
.stars + .lead{text-align:center}

/* ================= title ================= */
#title{position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  padding:0 max(20px, var(--sr)) calc(16px + var(--sb)) max(20px, var(--sl));
  background:linear-gradient(to bottom, rgba(255,240,210,0) 40%, rgba(30,20,12,.55))}
#logo{position:absolute; top:calc(4vh + var(--st)); left:16px; right:16px; text-align:center}
#logo h1{margin:0; display:inline-flex; align-items:center; gap:.06em; font:400 clamp(50px,15.5vh,96px)/.95 var(--display); color:#fff8e6;
  -webkit-text-stroke:.09em #2b1d14; paint-order:stroke fill;
  filter:drop-shadow(3px 0 0 #fff4dc) drop-shadow(-3px 0 0 #fff4dc) drop-shadow(0 3px 0 #fff4dc) drop-shadow(0 -3px 0 #fff4dc) drop-shadow(0 6px 0 #2b1d14) drop-shadow(0 12px 18px rgba(0,0,0,.3));
  animation:float 4s ease-in-out infinite}
#logo h1 .lbolt{width:.62em; height:.62em; margin:0 -.04em; transform:rotate(8deg)}
#logo h1 em{font-style:normal; color:#ffcf6b}
#logo p{margin:6px auto 0; font:400 clamp(16px,4.6vh,23px)/1.2 var(--display); color:#2b1d14; -webkit-text-stroke:4px #fff4dc; paint-order:stroke fill;
  text-shadow:0 3px 6px rgba(0,0,0,.25)}
#logo #dedic{display:inline-block; margin-top:8px}
@keyframes float{50%{transform:translateY(-6px) rotate(-1deg)}}
#dedic{position:relative; margin:0 0 12px; padding:8px 26px 9px; background:linear-gradient(#e0473a,#b52d22); color:#fff8e6; text-align:center;
  font:400 clamp(17px,4.8vh,24px)/1.15 var(--display); box-shadow:0 0 0 3px #fff4dc, 0 0 0 6px rgba(30,20,12,.5), 0 8px 18px rgba(0,0,0,.3);
  border-radius:6px; animation:ribbon .9s cubic-bezier(.2,1.4,.4,1) .3s both}
#dedic small{display:block; font:700 11.5px/1.2 var(--ui); opacity:.9; letter-spacing:.02em}
#dedic:before,#dedic:after{content:''; position:absolute; top:10px; width:20px; height:100%; background:#8d1f17; z-index:-1}
#dedic:before{right:-14px; clip-path:polygon(0 0,100% 0,70% 50%,100% 100%,0 100%)}
#dedic:after{left:-14px; clip-path:polygon(0 0,100% 0,100% 100%,0 100%,30% 50%)}
@keyframes ribbon{from{transform:scale(.4) rotate(-6deg); opacity:0}}
.tbtns{display:flex; gap:12px; width:min(520px,100%)}
.tbtns .big{flex:1}
#loadbar{width:min(420px,100%); height:12px; border-radius:10px; background:rgba(251,240,220,.35); overflow:hidden; margin-bottom:10px; box-shadow:0 0 0 2px rgba(30,20,12,.35)}
#loadfill{height:100%; width:0; background:var(--paper); transition:width .2s}
#loadtxt{color:#fff8e6; font:700 14px var(--ui); margin-bottom:6px; text-shadow:0 1px 3px rgba(0,0,0,.6)}
.credit{color:#fff8e6; opacity:.85; font:500 11px/1.4 var(--ui); margin-top:8px; text-align:center; text-shadow:0 1px 3px rgba(0,0,0,.7)}
#fade{position:fixed; inset:0; background:#140e08; opacity:0; pointer-events:none; z-index:25; transition:opacity .6s; display:flex; align-items:center; justify-content:center;
  color:#fff1d6; font:400 28px/1.4 var(--display); text-align:center; padding:24px}

/* short screens (phones sideways): tighter */
@media (max-height:420px){
  #btns{transform:scale(.84)}
  #stick{left:calc(18px + var(--sl) + 54px); bottom:calc(18px + var(--sb) + 54px); width:108px; height:108px; margin:0 0 -54px -54px}
  .levels{gap:6px} .lv{min-height:118px; padding:6px 4px} .lv .n{width:40px; height:40px; font-size:19px}
  .powerCard .orb{width:78px; height:78px}
  .stars svg{width:46px; height:46px}
}
@media (max-height:340px){ #btns{transform:scale(.74)} }
@media (min-height:600px) and (min-width:900px){ #btns{transform:scale(1.08)} }
/* phone held upright: ask to turn it sideways */
#rotate{position:fixed; inset:0; z-index:60; display:none; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px;
  background:radial-gradient(circle at 50% 40%, #e0473a, #7d1a12); color:#fff8e6; text-align:center}
#rotate svg{width:96px; height:96px; animation:turn 2.2s ease-in-out infinite}
#rotate b{font:400 30px/1.2 var(--display)}
#rotate span{font:600 16px/1.45 var(--ui); max-width:280px; opacity:.92}
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (orientation:portrait) and (pointer:coarse){ #rotate{display:flex} }
@media (hover:hover) and (pointer:fine){ #stickZone{display:none} }
@media (prefers-reduced-motion:reduce){ #logo h1,#bStorm,#bStorm > svg.ico{animation:none} .pop,#banner div{animation-duration:.01s} }
</style>
</head>

<div id="fade"></div>
